name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-architecture:
    name: Architecture Ratchets (Rule 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Architecture Ratchets
        run: ./dev check

  chaos-recovery:
    name: Chaos & Fault Injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Chaos Tests
        run: ./dev chaos

  lint:
    name: Lint (libs/custody, libs/sign)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Ruff Check
        run: uv run ruff check libs/custody libs/sign

  loops-min-distribution:
    name: loops-min Suite & Root Wheel Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test loops-min and Claude Arrival adapter
        run: uv run --package loops-min pytest apps/loops-min/tests clients/claude-code/tests -q

      - name: Lint Claude Arrival adapter
        run: uv run --package loops-min ruff check clients/claude-code

      - name: Build root wheel and smoke installed loops-min
        run: |
          artifact_root=$(mktemp -d "$RUNNER_TEMP/loops-min-root-wheel.XXXXXX")
          uv build --wheel --out-dir "$artifact_root" .
          uv venv "$artifact_root/venv" --python 3.13
          uv pip install --python "$artifact_root/venv/bin/python" "$artifact_root"/strange_loops-*.whl
          "$artifact_root/venv/bin/python" apps/loops-min/tests/wheel_smoke.py "$artifact_root/venv/bin/loops-min"
          "$artifact_root/venv/bin/python" clients/claude-code/tests/installed_smoke.py "$artifact_root/venv/bin/loops-min" "$GITHUB_WORKSPACE/clients/claude-code/hooks/arrival_session.py"

  discover:
    name: Discover Packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      # libs only, deliberately. apps/* is out of scope for CI: apps/loops is
      # slated for replacement, and the focus is the core libraries it will be
      # rebuilt on. Discovery is still a glob rather than a list, so a new
      # library reaches CI without editing this file — the point was never to
      # enumerate, it was to stop enumerating.
      - name: Discover libraries with tests
        id: discover
        run: |
          pkgs=$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' $(for dir in libs/*/; do [ -d "${dir}tests" ] && basename "$dir"; done))
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

  test-packages:
    name: Test (${{ matrix.package }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Library Tests
        run: |
          for dir in "libs/${{ matrix.package }}/tests"; do
            if [ -d "$dir" ]; then
              uv run --package ${{ matrix.package }} pytest "$dir" -q
            fi
          done
