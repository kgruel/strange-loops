[project]
name = "sdk"
version = "0.1.0"
description = "Loops apex composition library — headless operations (read, emit, kind mutations) over engine, custody, lang, and store"
readme = "README.md"
authors = [{ name = "Kyle Gruel", email = "kylegruel@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "atoms",
    "custody",
    "engine",
    "lang",
    "sign",
    "store",
]

[tool.uv.sources]
atoms = { workspace = true }
custody = { workspace = true }
engine = { workspace = true }
lang = { workspace = true }
sign = { workspace = true }
store = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mutmut>=3.2",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.mutmut]
source_paths = ["src/sdk/"]
also_copy = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/sdk"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
