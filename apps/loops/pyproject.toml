[project]
name = "loops"
version = "0.1.0"
description = "CLI for .loop and .vertex files"
requires-python = ">=3.11"
dependencies = ["lang", "atoms", "engine", "custody", "sign", "store", "migrate", "painted"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "rfc8785>=0.1.4"]

[tool.uv.sources]
lang = { workspace = true }
atoms = { workspace = true }
engine = { workspace = true }
custody = { workspace = true }
sign = { workspace = true }
store = { workspace = true }
migrate = { workspace = true }

[project.scripts]
loops = "loops.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
