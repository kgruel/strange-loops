[project]
name = "client"
version = "0.1.0"
description = "Loops apex composition library — headless operations (read, emit, kind mutations) over engine, custody, lang, and store"
readme = "README.md"
authors = [{ name = "Kyle Gruel", email = "kylegruel@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "atoms",
    "custody",
    "engine",
    "lang",
    "sign",
    "store",
]

[tool.uv.sources]
atoms = { workspace = true }
custody = { workspace = true }
engine = { workspace = true }
lang = { workspace = true }
sign = { workspace = true }
store = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
