name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-architecture:
    name: Architecture Ratchets (Rule 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Architecture Ratchets
        run: ./dev check

  chaos-recovery:
    name: Chaos & Fault Injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Chaos Tests
        run: ./dev chaos

  test-libraries:
    name: Test Libs (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [atoms, custody, engine, lang, sign, store]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Library Tests
        run: |
          if [ -d "libs/${{ matrix.package }}" ]; then
            uv run --package ${{ matrix.package }} pytest libs/${{ matrix.package }}/tests -q
          fi
