name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-architecture:
    name: Architecture Ratchets (Rule 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Architecture Ratchets
        run: ./dev check

  chaos-recovery:
    name: Chaos & Fault Injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Chaos Tests
        run: ./dev chaos

  lint:
    name: Lint (libs/custody, libs/sign)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Ruff Check
        run: uv run ruff check libs/custody libs/sign

  loops-min-distribution:
    name: loops-min Suite & Root Wheel Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test, lint, and smoke client delivery artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifact_root=$(mktemp -d "$RUNNER_TEMP/loops-min-delivery-artifacts.XXXXXX")
          mkdir -p "$artifact_root/home" "$artifact_root/outside-checkout"
          isolated=(
            env -i
            "PATH=$PATH" "HOME=$artifact_root/home" "UV_CACHE_DIR=$artifact_root/uv-cache"
            "UV_PROJECT_ENVIRONMENT=$artifact_root/uv-project" "LOOPS_HOME=$artifact_root/loops-home"
            "XDG_STATE_HOME=$artifact_root/state" "XDG_CONFIG_HOME=$artifact_root/config"
            "XDG_DATA_HOME=$artifact_root/data" "XDG_CACHE_HOME=$artifact_root/cache"
            # setup-python may need its shared-library path on Linux.
            "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
          )
          "${isolated[@]}" uv run --python 3.13 --package loops-min pytest \
            tests/test_root_console_scripts.py apps/loops-min/tests clients/claude-code/tests -q
          "${isolated[@]}" uv run --python 3.13 --package loops-min ruff check \
            apps/loops-min/tests/wheel_smoke.py clients/claude-code tests/test_root_console_scripts.py
          "${isolated[@]}" uv build --python 3.13 --wheel --out-dir "$artifact_root/wheel" .
          "${isolated[@]}" uv venv "$artifact_root/venv" --python 3.13
          "${isolated[@]}" uv pip install --python "$artifact_root/venv/bin/python" "$artifact_root"/wheel/strange_loops-*.whl
          (
            cd "$artifact_root/outside-checkout"
            "${isolated[@]}" "$artifact_root/venv/bin/python" "$GITHUB_WORKSPACE/apps/loops-min/tests/wheel_smoke.py" "$artifact_root/venv/bin/loops-min"
            "${isolated[@]}" "$artifact_root/venv/bin/python" "$GITHUB_WORKSPACE/clients/claude-code/build_plugin.py" "$artifact_root/claude plugin"
            "${isolated[@]}" "$artifact_root/venv/bin/python" "$GITHUB_WORKSPACE/clients/claude-code/tests/installed_smoke.py" "$artifact_root/venv/bin/loops-min" "$artifact_root/claude plugin"
          )

  discover:
    name: Discover Packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      # libs only, deliberately. apps/* is out of scope for CI: apps/loops is
      # slated for replacement, and the focus is the core libraries it will be
      # rebuilt on. Discovery is still a glob rather than a list, so a new
      # library reaches CI without editing this file — the point was never to
      # enumerate, it was to stop enumerating.
      - name: Discover libraries with tests
        id: discover
        run: |
          pkgs=$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' $(for dir in libs/*/; do [ -d "${dir}tests" ] && basename "$dir"; done))
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

  test-packages:
    name: Test (${{ matrix.package }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Library Tests
        run: |
          for dir in "libs/${{ matrix.package }}/tests"; do
            if [ -d "$dir" ]; then
              uv run --package ${{ matrix.package }} pytest "$dir" -q
            fi
          done
