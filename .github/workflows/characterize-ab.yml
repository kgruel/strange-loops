name: Characterize A/B

# Measures the base and the head of a pull request ON THE SAME RUNNER, IN THE
# SAME JOB, and compares them there.
#
# Why this exists, concretely. The per-commit recorder (characterize.yml) writes
# one arm per commit landing on main, and those arms are NOT comparable to each
# other: every push gets a fresh runner. Two consecutive main commits measured
# that way came out ~2.1x apart on probes whose code was byte-identical — the
# machine changed, nothing else did. A series of such arms captures shape, which
# is real and useful, but it cannot show progression.
#
# Measuring both arms in one job is what makes machine identity cancel. It is
# the only honest way to ask "did this PR change the cost of anything".
#
# Two disciplines carried over from doing this by hand:
#
#   ORDER ALTERNATES, it does not merely interleave. Running the candidate
#   second every time produces monotonic thermal drift that looks exactly like a
#   regression. Arms run A B A B A, so each appears at mean position 3.
#
#   THE INSTRUMENT MUST BE IDENTICAL ACROSS ARMS. The head's characterize.py is
#   copied into the base worktree and the two are diffed before anything runs.
#   Otherwise a PR that touches the instrument would be comparing two different
#   instruments and calling the difference a code change.
#
# This job REPORTS, it does not gate. Its false-positive rate on this repo is
# unmeasured, and today a single-bracket comparison produced a +14.5% delta
# against a ±0.6% floor that re-measured at +2.6%. Gate on it only after enough
# runs to know what it does when nothing has changed.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      depths:
        description: "Comma-separated store depths"
        default: "1000,5000"
        type: string

jobs:
  ab:
    name: Base vs head, same runner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Shallower than the per-commit recorder on purpose: this job detects
      # CHANGE, it does not characterize absolute cost. Filling a vertex is
      # quadratic, so a 20k band would put five arms well past an hour.
      DEPTHS: ${{ inputs.depths || '1000,5000' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve the two commits
        id: refs
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi
          # The merge base, not the base branch tip — otherwise unrelated commits
          # that landed on main since this PR opened get attributed to the PR.
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base=$MERGE_BASE" >> "$GITHUB_OUTPUT"
          echo "Comparing ${MERGE_BASE:0:12} (base) against ${HEAD_SHA:0:12} (head)"

      - name: Lay out both worktrees with one instrument
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/arm-base "${{ steps.refs.outputs.base }}"
          git worktree add --detach /tmp/arm-head "${{ steps.refs.outputs.head }}"

          if [ ! -f /tmp/arm-head/benchmarks/characterize.py ]; then
            echo "::error::head has no benchmarks/characterize.py — nothing to measure with"
            exit 1
          fi

          # One instrument, both arms. A PR that edits characterize.py would
          # otherwise be comparing two different instruments and calling the
          # difference a result.
          mkdir -p /tmp/arm-base/benchmarks
          cp /tmp/arm-head/benchmarks/characterize.py /tmp/arm-base/benchmarks/characterize.py

          if ! diff -q /tmp/arm-base/benchmarks/characterize.py \
                       /tmp/arm-head/benchmarks/characterize.py; then
            echo "::error::instruments differ across arms after copy"
            exit 1
          fi
          echo "instrument verified identical across arms"

      - name: Warm both environments
        run: |
          set -euo pipefail
          # Sync before timing so no arm pays for a dependency install that the
          # other one does not, and so the first `uv run` of a measured arm is
          # not racing its own resolution.
          (cd /tmp/arm-base && uv sync --quiet)
          (cd /tmp/arm-head && uv sync --quiet)

      - name: Measure A B A B A
        run: |
          set -uo pipefail
          mkdir -p /tmp/arms
          run_arm () {
            local dir="$1" label="$2" out="$3"
            echo "::group::$label"
            ( cd "$dir" && uv run python benchmarks/characterize.py \
                --depths "$DEPTHS" --label "$label" --record "$out" ) || \
              echo "::warning::$label did not complete"
            echo "::endgroup::"
          }
          # Alternating, balanced: base at positions 1,3,5 and head at 2,4 —
          # both average position 3, so linear thermal drift cancels.
          run_arm /tmp/arm-base base-1 /tmp/arms/base-1.json
          run_arm /tmp/arm-head head-1 /tmp/arms/head-1.json
          run_arm /tmp/arm-base base-2 /tmp/arms/base-2.json
          run_arm /tmp/arm-head head-2 /tmp/arms/head-2.json
          run_arm /tmp/arm-base base-3 /tmp/arms/base-3.json

      - name: Compare, with the noise floor measured from the base repeats
        id: compare
        run: |
          set -uo pipefail
          if [ ! -f /tmp/arms/base-1.json ] || [ ! -f /tmp/arms/head-1.json ]; then
            echo "::warning::not enough arms completed to compare"
            exit 0
          fi
          # Two base repeats become the floor, which is what lets the comparison
          # say anything stronger than "candidate" — one repeat estimates a
          # probe's spread from a single pair of numbers and demonstrably
          # produces false positives.
          BRACKETS=""
          [ -f /tmp/arms/base-2.json ] && BRACKETS="$BRACKETS --bracket /tmp/arms/base-2.json"
          [ -f /tmp/arms/base-3.json ] && BRACKETS="$BRACKETS --bracket /tmp/arms/base-3.json"

          ( cd /tmp/arm-head && uv run python benchmarks/characterize.py \
              --compare /tmp/arms/base-1.json /tmp/arms/head-1.json \
              $BRACKETS ) | tee /tmp/arms/comparison.txt

      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo "## Characterize A/B"
            echo ""
            echo "base \`${{ steps.refs.outputs.base }}\` → head \`${{ steps.refs.outputs.head }}\`"
            echo ""
            echo "Both arms measured on **this runner, in this job**, order alternating"
            echo "A B A B A. The noise floor below is measured from the base repeats,"
            echo "not assumed. This job reports; it does not gate."
            echo ""
            if [ -f /tmp/arms/comparison.txt ]; then
              echo '```'
              cat /tmp/arms/comparison.txt
              echo '```'
            else
              echo "_No comparison produced — see the job log._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload arms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: characterize-ab-${{ github.event.pull_request.number || github.run_id }}
          path: /tmp/arms/
          retention-days: 30
