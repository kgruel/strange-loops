name: Benchmark Gate

on:
  pull_request:
    branches: [main]

jobs:
  benchmark-comparison:
    name: Hotpath Performance vs Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Benchmark Gate
        id: bench
        run: |
          echo "## ⚡ Performance Benchmark vs Main Baseline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          uv run python benchmarks/benchmark_hotpath.py --compare benchmarks/baseline.json --threshold 10 | tee bench_output.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat bench_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
