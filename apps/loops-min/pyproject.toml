[project]
name = "loops-min"
version = "0.1.0"
description = "Minimal JSON process client for the Loops headless SDK"
requires-python = ">=3.11"
dependencies = ["sdk"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "atoms", "custody", "engine", "lang", "sign"]

[tool.uv.sources]
sdk = { workspace = true }
atoms = { workspace = true }
custody = { workspace = true }
engine = { workspace = true }
lang = { workspace = true }
sign = { workspace = true }

[project.scripts]
loops-min = "loops_min.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loops_min"]

[tool.pytest.ini_options]
testpaths = ["tests"]
